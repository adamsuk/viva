# Factory agents for Viva (see the gh-factory README, "Agents", and
# adamsuk/software-factory AGENTS.md). Enrolled 2026-11-23 (adamsuk/software-factory#455).
# The maintainer merges pull requests, so agents.merge stays false.
agents:
  roles: [builder, reviewer]
  merge: false
  # CodeRabbit has not been confirmed on this repo yet, so PR Reviewer's review is the gate.
  # Switch to coderabbit once it reviews a PR here.
  review_bot: none
  # The same three commands test.yml runs on every pull request.
  test_command: npm run typecheck && npm run lint && npm test

# Check names from the pull-request workflows: the test job in test.yml and
# the changelog job in changelog.yml.
required_checks:
  - test
  - changelog
